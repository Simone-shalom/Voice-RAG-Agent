services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: voicerag
      POSTGRES_PASSWORD: voicerag
      POSTGRES_DB: voicerag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicerag -d voicerag"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://voicerag:voicerag@postgres:5432/voicerag
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:

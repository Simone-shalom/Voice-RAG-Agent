services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: voicerag
      POSTGRES_PASSWORD: voicerag
      POSTGRES_DB: voicerag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicerag -d voicerag"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://voicerag:voicerag@postgres:5432/voicerag
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file: .env
    environment:
      # Consumed only by next.config.ts's server-side rewrite proxy, which
      # runs inside this container — "backend" is the compose service's
      # internal DNS name, not reachable as "localhost" from here.
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
